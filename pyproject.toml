[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlesense"
version = "0.1.0"
description = "A verified settlement-reconciliation agent: deterministic where it can be, constrained AI only where the evidence justifies it."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pyyaml",
    "python-Levenshtein",
    "streamlit",
    "lxml",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
# Explicit include list: subpackages must be captured too (settlesense.matching,
# settlesense.ai, eval.baselines, ...), and neither tests/ nor fixtures/ ships.
include = ["settlesense*", "gen*", "eval*"]
exclude = ["tests*", "fixtures*", "data*", "reports*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# --strict-markers so a typo'd marker fails loudly rather than silently
# selecting nothing - `make check` runs `-m determinism`, and a marker typo
# there would report success having run no guard at all.
# -q is NOT set here: the Makefile passes it, and setting it in both places
# means `pytest -v` silently stays quiet.
addopts = "--strict-markers --strict-config"
markers = [
    "golden: byte-compares full pipeline output against a committed golden file",
    "determinism: a D1-D13 charter guard test",
    # FAULT-INJECTION CATEGORIES. Every guard in this project is paired with a
    # test that makes it fire. A check you cannot break on demand is one you
    # know has not complained, which is not the same as knowing it works.
    # `make fault-report` summarises these by category.
    "config_refusal: feeds the config loader a deliberately broken file",
    "charter_guard: feeds a D1-D13 scanner a known violation",
    "truth_injection: corrupts a dataset and requires the self-check to fail",
    "noise_accounting: breaks the two-way noise ledger in one direction",
    "hygiene: repository and manifest invariants",
    "boundary_refusal: feeds the parse/ingest boundary malformed external input",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown is EXCLUDED deliberately. Recent ruff formats Python code blocks
# inside .md files, which would rewrite the PDD and SDD - the specification
# this project is measured against. A formatter must never edit the spec.
extend-exclude = ["*.md", ".venv", "data", "reports", "fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting - deterministic import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "DTZ",  # flake8-datetimez: catches naive datetime use, supports D2
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Stub modules are docstring-only until their gate.
"settlesense/**/__init__.py" = ["F401"]
"gen/__init__.py" = ["F401"]
"eval/**/__init__.py" = ["F401"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Type hints are required on every public function (project standing rule),
# so an untyped def is an error rather than a warning.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["Levenshtein.*", "streamlit.*", "yaml.*"]
ignore_missing_imports = true

# numpy is never imported by this project. It arrives transitively (streamlit,
# and hypothesis's numpy extra), and its stubs use `type` statements that need
# Python 3.12+ to parse - while python_version above is deliberately pinned to
# 3.11, the floor in requires-python, so our own code is checked against the
# oldest interpreter we claim to support.
#
# follow_imports, not ignore_missing_imports: the package IS found, and the
# failure is mypy refusing to PARSE it. Raising python_version to silence this
# would stop checking our code against 3.11, which is the opposite trade.
#
# This surfaced only once the declared dependencies were actually installed -
# before that, streamlit was absent and mypy never followed the chain. A second
# instance of a check that was not running looking exactly like one that passes.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
